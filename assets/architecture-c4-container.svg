<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1080" width="1280" height="1080" role="img" aria-label="Container diagram for ZonIA (C4 model)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5143"/></marker>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #1f2a17; }
      .subtitle { font-size: 14px; fill: #5b6452; }
      .name { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .type { font-size: 11px; text-anchor: middle; }
      .desc { font-size: 13px; text-anchor: middle; }
      .rel { font-size: 12px; fill: #3b4235; }
      .tech { font-size: 11px; fill: #6b7263; }
      .mid { text-anchor: middle; }
      .end { text-anchor: end; }
      .person { fill: #ffffff; stroke: #4d8a1f; stroke-width: 2.5; }
      .person-t { fill: #3d7019; }
      .cont { fill: #ffffff; stroke: #2a6b50; stroke-width: 2.5; }
      .cont-t { fill: #1f5a41; }
      .ext { fill: #ffffff; stroke: #7a8072; stroke-width: 2.5; stroke-dasharray: 7 4; }
      .ext-t { fill: #555b4e; }
      .line { fill: none; stroke: #4a5143; stroke-width: 1.6; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .bg { fill: #ffffff; }
      .icon { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; fill: #2a6b50; }
    </style>
  </defs>

  <rect width="1280" height="1080" rx="16" fill="#ffffff"/>

  <!-- Title -->
  <text class="title" x="40" y="48">Container diagram for ZonIA</text>
  <text class="subtitle" x="40" y="72">C4 model, level 2. Scope: the ZonIA software system.</text>

  <!-- System boundary -->
  <rect x="290" y="292" width="960" height="640" rx="14" fill="#f6faf0" stroke="#2a6b50" stroke-width="1.6"/>
  <text x="308" y="904" font-size="17" font-weight="700" fill="#1f5a41">ZonIA</text>
  <text x="308" y="921" font-size="11" fill="#1f5a41">[Software System]</text>

  <!-- ===== Relationships (drawn first, under the boxes) ===== -->
  <!-- 1 Candidate -> Candidate pages -->
  <path class="line" d="M520 252 V328"/>
  <rect class="bg" x="528" y="262" width="196" height="18"/>
  <text class="rel" x="532" y="276">Applies by chat or voice using</text>

  <!-- 2 Candidate pages -> zonia-server -->
  <path class="line" d="M520 472 V558"/>
  <text class="rel" x="532" y="506">Chat: sends messages,</text>
  <text class="rel" x="532" y="521">loads the pages</text>
  <text class="tech" x="532" y="536">[HTTPS]</text>

  <!-- 3 Candidate pages -> ElevenLabs -->
  <path class="line" d="M378 400 H224"/>
  <rect class="bg" x="252" y="346" width="96" height="46"/>
  <text class="rel mid" x="300" y="359">Voice: streams</text>
  <text class="rel mid" x="300" y="373">the call audio</text>
  <text class="tech mid" x="300" y="387">[WebSocket]</text>

  <!-- 4 ElevenLabs -> zonia-server -->
  <path class="line" d="M200 462 L378 598"/>
  <text class="rel mid" x="118" y="492">Voice: sends the transcript,</text>
  <text class="rel mid" x="118" y="507">gets Sonia's reply</text>
  <text class="tech mid" x="118" y="522">[HTTPS, OpenAI format]</text>

  <!-- 5 zonia-server -> LLM provider -->
  <path class="line" d="M378 640 H224"/>
  <rect class="bg" x="246" y="590" width="100" height="44"/>
  <text class="rel mid" x="296" y="603">1 or 2 calls</text>
  <text class="rel mid" x="296" y="617">per turn</text>
  <text class="tech mid" x="296" y="630">[HTTPS, JSON]</text>

  <!-- 6 zonia-server -> Database -->
  <path class="line" d="M520 702 V838 H698"/>
  <text class="rel" x="532" y="742">Reads and saves each turn</text>
  <text class="tech" x="532" y="757">[SQLite file]</text>

  <!-- 7 zonia-followups -> Database -->
  <path class="line" d="M820 702 V772"/>
  <text class="rel" x="832" y="728">Saves reminders and</text>
  <text class="rel" x="832" y="743">status changes</text>
  <text class="tech" x="832" y="758">[SQLite file]</text>

  <!-- 8 zonia-dashboard -> Database -->
  <path class="line" d="M1100 702 V838 H942"/>
  <text class="rel" x="1110" y="758">Reads conversations,</text>
  <text class="rel" x="1110" y="773">saves the outcome</text>
  <text class="tech" x="1110" y="788">[SQLite file]</text>

  <!-- 9 Recruiter -> zonia-dashboard -->
  <path class="line" d="M1100 252 V558"/>
  <text class="rel end" x="1088" y="400">Reviews candidates and</text>
  <text class="rel end" x="1088" y="415">records the outcome using</text>
  <text class="tech end" x="1088" y="430">[HTTPS, web browser]</text>

  <!-- ===== People ===== -->
  <!-- Candidate -->
  <circle class="person" cx="520" cy="112" r="30"/>
  <rect class="person" x="400" y="146" width="240" height="104" rx="28"/>
  <text class="name person-t" x="520" y="180">Candidate</text>
  <text class="type person-t" x="520" y="197">[Person]</text>
  <text class="desc person-t" x="520" y="219">Applies for a delivery-driver</text>
  <text class="desc person-t" x="520" y="236">job by chat or by voice.</text>

  <!-- Recruiter -->
  <circle class="person" cx="1100" cy="112" r="30"/>
  <rect class="person" x="980" y="146" width="240" height="104" rx="28"/>
  <text class="name person-t" x="1100" y="180">Recruiter</text>
  <text class="type person-t" x="1100" y="197">[Person]</text>
  <text class="desc person-t" x="1100" y="219">Reviews screened candidates</text>
  <text class="desc person-t" x="1100" y="236">and records the outcome.</text>

  <!-- ===== External systems ===== -->
  <!-- ElevenLabs -->
  <rect class="ext" x="30" y="330" width="192" height="130" rx="10"/>
  <text class="name ext-t" x="126" y="370">ElevenLabs</text>
  <text class="type ext-t" x="126" y="387">[Software System]</text>
  <text class="desc ext-t" x="126" y="411">Speech to text and</text>
  <text class="desc ext-t" x="126" y="428">text to speech</text>
  <text class="desc ext-t" x="126" y="445">for voice calls.</text>

  <!-- LLM provider -->
  <rect class="ext" x="30" y="575" width="192" height="120" rx="10"/>
  <text class="name ext-t" x="126" y="615">LLM provider</text>
  <text class="type ext-t" x="126" y="632">[Software System]</text>
  <text class="desc ext-t" x="126" y="656">Any OpenAI-</text>
  <text class="desc ext-t" x="126" y="673">compatible API.</text>

  <!-- ===== Containers ===== -->
  <!-- Candidate pages (browser) -->
  <rect class="cont" x="380" y="330" width="280" height="140" rx="10"/>
  <path d="M380 340 A10 10 0 0 1 390 330 H650 A10 10 0 0 1 660 340 V354 H380 Z" fill="#2a6b50"/>
  <circle cx="396" cy="342" r="4" fill="#ffffff"/>
  <circle cx="410" cy="342" r="4" fill="#ffffff"/>
  <circle cx="424" cy="342" r="4" fill="#ffffff"/>
  <text class="name cont-t" x="520" y="384">Candidate pages</text>
  <text class="type cont-t" x="520" y="401">[Container: HTML, JavaScript, in the browser]</text>
  <text class="desc cont-t" x="520" y="425">Apply page, web chat and voice page.</text>
  <text class="desc cont-t" x="520" y="442">The voice page talks to ElevenLabs.</text>

  <!-- zonia-server -->
  <rect class="cont" x="380" y="560" width="280" height="140" rx="10"/>
  <text class="icon" x="394" y="582">&gt;_</text>
  <text class="name cont-t" x="520" y="602">zonia-server</text>
  <text class="type cont-t" x="520" y="619">[Container: Python, FastAPI, Pydantic AI]</text>
  <text class="desc cont-t" x="520" y="643">Serves the candidate pages and</text>
  <text class="desc cont-t" x="520" y="660">runs Sonia's turns: the LLM reads,</text>
  <text class="desc cont-t" x="520" y="677">code decides.</text>

  <!-- zonia-followups -->
  <rect class="cont" x="700" y="560" width="240" height="140" rx="10"/>
  <text class="icon" x="714" y="582">&gt;_</text>
  <text class="name cont-t" x="820" y="602">zonia-followups</text>
  <text class="type cont-t" x="820" y="619">[Container: Python, cron job]</text>
  <text class="desc cont-t" x="820" y="643">Runs every minute: saves</text>
  <text class="desc cont-t" x="820" y="660">reminders and applies</text>
  <text class="desc cont-t" x="820" y="677">time limits.</text>

  <!-- zonia-dashboard -->
  <rect class="cont" x="975" y="560" width="250" height="140" rx="10"/>
  <text class="icon" x="989" y="582">&gt;_</text>
  <text class="name cont-t" x="1100" y="602">zonia-dashboard</text>
  <text class="type cont-t" x="1100" y="619">[Container: Python, FastAPI]</text>
  <text class="desc cont-t" x="1100" y="640">Server-side web app: builds the</text>
  <text class="desc cont-t" x="1100" y="656">dashboard pages (candidate list,</text>
  <text class="desc cont-t" x="1100" y="672">filters, detail, outcome).</text>

  <!-- Database -->
  <path class="cont" d="M700 788 V888 A120 14 0 0 0 940 888 V788"/>
  <ellipse class="cont" cx="820" cy="788" rx="120" ry="14"/>
  <text class="name cont-t" x="820" y="828">Database</text>
  <text class="type cont-t" x="820" y="845">[Container: SQLite file]</text>
  <text class="desc cont-t" x="820" y="867">Conversations, screening</text>
  <text class="desc cont-t" x="820" y="884">fields and every message.</text>

  <!-- ===== Key ===== -->
  <line x1="40" y1="956" x2="1240" y2="956" stroke="#dfe6d6"/>
  <text x="40" y="984" font-size="14" font-weight="700" fill="#1f2a17">Key</text>

  <circle class="person" cx="112" cy="986" r="9" stroke-width="2"/>
  <rect class="person" x="96" y="998" width="32" height="20" rx="8" stroke-width="2"/>
  <text class="rel" x="138" y="1012">Person</text>

  <rect class="cont" x="200" y="986" width="40" height="30" rx="5" stroke-width="2"/>
  <rect x="200" y="986" width="40" height="8" fill="#2a6b50"/>
  <text class="rel" x="250" y="1006">Container in the browser</text>

  <rect class="cont" x="425" y="986" width="40" height="30" rx="5" stroke-width="2"/>
  <text class="icon" x="431" y="1006" font-size="12">&gt;_</text>
  <text class="rel" x="475" y="1006">Container that runs code on the server</text>

  <path class="cont" d="M725 990 V1012 A20 5 0 0 0 765 1012 V990" stroke-width="2"/>
  <ellipse class="cont" cx="745" cy="990" rx="20" ry="5" stroke-width="2"/>
  <text class="rel" x="775" y="1006">Container that stores data</text>

  <rect class="ext" x="960" y="986" width="40" height="30" rx="5" stroke-width="2"/>
  <text class="rel" x="1010" y="1006">External software system</text>

  <rect x="200" y="1036" width="40" height="24" rx="5" fill="#f6faf0" stroke="#2a6b50" stroke-width="1.6"/>
  <text class="rel" x="250" y="1053">Software system boundary</text>

  <path class="line" d="M430 1048 H490"/>
  <text class="rel" x="500" y="1053">One-way relationship: what it does, then the technology in [brackets]</text>
</svg>
