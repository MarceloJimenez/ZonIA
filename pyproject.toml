[project]
name = "zonia"
version = "0.1.0"
description = "Candidate screener AI agent for Grupo Sazón"
readme = "README.md"
authors = [
    { name = "Marcelo Jiménez", email = "marcelojdf1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai]>=2.66.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
zonia = "zonia.main:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
